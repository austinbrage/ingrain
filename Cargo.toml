[package]
name = "ingrain"
version = "0.1.0"
edition = "2024"

[dependencies]
catppuccin = { version = "2.8.0", features = ["ratatui"] }
directories = "6.0.0"
include_dir = "0.7.4"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tree-sitter-go = "0.25.0"
tree-sitter-highlight = "0.26.13"
tree-sitter-rust = "0.24.2"
tui-big-text = "0.8.10"
tui-markdown = { version = "0.3.10", default-features = false }

[dev-dependencies]
tempfile = "3"
